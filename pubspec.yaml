name: sehati_ai
description: SEHATI-AI - Sistem Evaluasi Holistik Aktivitas Fisik dan Nutrisi Terintegrasi dengan Artificial Intelligence
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Navigation
  go_router: ^13.2.0
  # Camera
  camera: ^0.10.5+9
  # Permissions
  permission_handler: ^11.3.1
  # Animations
  flutter_animate: ^4.5.0
  # Icons
  flutter_svg: ^2.0.10+1
  # Shared preferences
  shared_preferences: ^2.2.3

  flutter_local_notifications: ^17.1.1
  timezone: ^0.9.2

  # Supabase
  supabase_flutter: ^2.5.4
  google_sign_in: ^6.2.1

  # Location & Maps
  geolocator: ^13.0.1
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  google_maps_flutter: ^2.10.0

  # Image & Utils
  image_picker: ^1.2.1
  image_cropper: ^8.0.2
  provider: ^6.1.2
  pedometer: ^4.2.0
  share_plus: ^12.0.1
  flutter_tts: ^4.0.2
  path_provider: ^2.1.5
  http: ^1.2.1
  html: ^0.15.4
  url_launcher: ^6.2.6
  intl: any
  flutter_background_service: ^5.0.5
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.0
  video_player: ^2.11.0
  google_mlkit_object_detection: ^0.15.1
  google_mlkit_image_labeling: ^0.14.2
  # Health & Wearable
  health: ^11.0.0
  # Bluetooth BLE - direct smartwatch connection
  flutter_blue_plus: ^1.35.3
  # Screen Time (Android only)
  usage_stats: ^1.0.3
  flutter_any_logo: ^1.1.2
  google_fonts: ^8.1.0
  sqflite: ^2.3.3
  crypto: ^3.0.3
  path: ^1.9.0
  workmanager: ^0.9.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  sensors_plus: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.2

  supabase: any
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/fitur/
    # DIBUKA SEMENTARA UNTUK LOCAL DEV AGAR TIDAK ERROR (Tidak perlu --dart-define)
    # Peringatan: Comment baris '- assets/config/' ini jika akan rilis APK ke public/PlayStore!
    - assets/config/
    # CATATAN KEAMANAN: File ai_config.json berisi API keys sensitif.
    # Gunakan --dart-define saat build:
    #   flutter build apk --dart-define=...
    - assets/exercises/
    - assets/exercises/gifs/
    - assets/exercises/images/
    - assets/exercises/chest/
    - assets/exercises/back/
    - assets/exercises/shoulders/
    - assets/exercises/arms/
    - assets/exercises/abs/
    - assets/exercises/legs/
    - assets/exercises/glutes/
    - assets/exercises/cardio/
    - ai_workspace/dataset/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

